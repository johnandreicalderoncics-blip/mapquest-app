name: CI

# Runs on every push to any branch and on every pull request into main.
# Combined with a branch-protection rule on main ("Require status checks
# to pass"), a PR cannot be merged unless every job below is green.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (syntax + undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      # Only hard errors fail the build: syntax errors, undefined names,
      # invalid comparisons. Style issues are not blocking.
      - run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # tkinter GUI tests need an X display; xvfb provides a virtual one.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      # Tests never call the real GraphHopper API (it is mocked), so no
      # API key secret is needed in CI.
      - name: Run test suite
        run: >
          xvfb-run -a python -m pytest -v
          --cov=backend --cov=src
          --cov-report=term-missing
          --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
